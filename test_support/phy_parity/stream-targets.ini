[env:Xiao_S3_WIO_stream_compile]
extends = env:Xiao_S3_WIO_kiss_wifi
build_flags =
  ${env:Xiao_S3_WIO_kiss_wifi.build_flags}
  -D KISS_STREAM_ENDPOINT=1
  -D KISS_LOCAL_SOURCES=3
  ; Compile-only pin values, not a deployable board wiring profile.
  -D KISS_UART_RX_PIN=1
  -D KISS_UART_TX_PIN=2
  -D KISS_UART_BAUD=115200
