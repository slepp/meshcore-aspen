name: Contributor checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  willow:
    name: Willow Hew build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libssl-dev libcurl4-openssl-dev libsodium-dev libcjson-dev cmake clang lld binaryen pkg-config zlib1g-dev libzstd-dev
          python3 -m pip install --require-hashes -r requirements-linux.lock
          python3 -m pip install platformio==6.1.19
      # Use the same published compiler, standard library and runtime tested
      # by Willow contributors, without rebuilding Hew's dependencies.
      - name: Install Hew 0.10.0-rc1 SDK
        run: |
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 15 --max-time 300 \
            -o hew-v0.10.0-rc1-linux-x86_64.tar.gz \
            https://github.com/hew-lang/hew/releases/download/v0.10.0-rc1/hew-v0.10.0-rc1-linux-x86_64.tar.gz
          echo 'c9fcb49d4bf7520dfad73942849019e3fa4e4278d7eb38a0601bc9ca5b0907b4  hew-v0.10.0-rc1-linux-x86_64.tar.gz' | sha256sum -c -
          mkdir -p .tmp/hew-sdk
          tar -xzf hew-v0.10.0-rc1-linux-x86_64.tar.gz -C .tmp/hew-sdk --strip-components=1
          .tmp/hew-sdk/bin/hew --version
          echo "$GITHUB_WORKSPACE/.tmp/hew-sdk/bin" >> "$GITHUB_PATH"
          echo "HEW_STD=$GITHUB_WORKSPACE/.tmp/hew-sdk/std" >> "$GITHUB_ENV"
      - name: Test independent Lua and WebAssembly packages
        run: |
          python3 packages/hew-lua/tests/run.py
          python3 packages/hew-wamr/tests/run.py
      - name: Build and test Willow
        env:
          BOT_JSON_INCLUDE: /usr/include/cjson
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
          WASM_CC: /usr/bin/clang
        run: |
          wasm-opt --version
          "$WASM_CC" --version
          "$("$WASM_CC" --target=wasm32 -print-prog-name=wasm-ld)" --version
          make -C hosts/willow -j2 check
  shared-room:
    name: Shared room Worker, web UI and opaque frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/shared-room/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: clients/room-tui/go.mod
          cache-dependency-path: clients/room-tui/go.sum
      - name: Check Worker
        working-directory: services/shared-room
        env:
          WRANGLER_SEND_METRICS: 'false'
          WRANGLER_LOG_PATH: .wrangler/check.log
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run test:browser
          npm run build
      - name: Check portable opaque frontend
        run: |
          make -C firmware/shared/cloudroom "$(pwd)/.tmp/cloudroom-wire/opaque"
          .tmp/cloudroom-wire/opaque
  room-tui:
    name: Room terminal client and Worker integration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: clients/room-tui/go.mod
          cache-dependency-path: clients/room-tui/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/shared-room/package-lock.json
      - name: Install local Worker dependencies
        working-directory: services/shared-room
        run: npm ci
      - name: Check terminal client
        working-directory: clients/room-tui
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          go test -race ./...
          go vet ./...
          node test/worker.mjs
  offline:
    name: Linux offline checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-linux.lock
      - name: Install Python dependencies
        run: python3 -m pip install --require-hashes -r requirements-linux.lock
      - name: Run local tests and build host tools
        run: make check
