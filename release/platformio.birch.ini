; Build evidence only: blank WiFi credentials cannot connect a newly installed modem.
; Qualify a private provisioning path before publishing a Birch host/modem bundle.
[env:public_birch]
extends = Xiao_S3_WIO
build_src_filter = ${Xiao_S3_WIO.build_src_filter}
  +<../examples/kiss_modem/>
build_flags =
  ${Xiao_S3_WIO.build_flags}
  -D WIFI_SSID='""'
  -D WIFI_PWD='""'
  -D KISS_TCP_PORT=8001
  -D KISS_MAX_TCP_CLIENTS=8
  -D KISS_REQUEST_QUEUE_DEPTH=12
  -D KISS_HOSTNAME='"birch"'
  -D KISS_WIFI_TX_POWER=WIFI_POWER_8_5dBm
