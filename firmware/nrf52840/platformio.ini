; Included only by the private, pinned upstream build under .build/.
[env:nrfmast_baseline]
extends = env:Xiao_nrf52_repeater
platform = nordicnrf52@11.0.0
build_unflags =
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D LORA_TX_POWER=22
build_flags =
  ${env:Xiao_nrf52_repeater.build_flags}
  -D LORA_FREQ=912.525
  -D LORA_BW=250.0
  -D LORA_SF=7
  -D LORA_CR=5
  -D LORA_TX_POWER=2

[env:nrfmast_rx]
extends = env:nrfmast_baseline
board_upload.maximum_size = 798720
board_upload.maximum_ram_size = 237568
build_unflags =
  ${env:nrfmast_baseline.build_unflags}
  ${sensor_base.build_flags}
  -D DISPLAY_CLASS=NullDisplayDriver
  -D ENABLE_ADVERT_ON_BOOT=1
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  -D ADMIN_PASSWORD='"password"'
build_flags =
  ${env:nrfmast_baseline.build_flags}
  -D ENABLE_ADVERT_ON_BOOT=0
  -D ADMIN_PASSWORD='""'
  -D MAX_CONTACTS=8
  -D MAX_CONNECTIONS=1
  -D NRFMAST_BLE_DFU=1
  -D NRFMAST_RF_ENABLED=0
  -I examples/simple_repeater
  -I examples/nrfmast
build_src_filter =
  ${Xiao_nrf52.build_src_filter}
  -<helpers/ui/NullDisplayDriver.cpp>
  +<../examples/simple_repeater/MyMesh.cpp>
  +<../examples/simple_repeater/RateLimiter.cpp>
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/nrfmast/*.cpp>
lib_deps = ${nrf52_base.lib_deps}

[env:nrfmast]
extends = env:nrfmast_rx
build_unflags =
  ${env:nrfmast_rx.build_unflags}
  -D NRFMAST_RF_ENABLED=0
build_flags =
  ${env:nrfmast_rx.build_flags}
  -D NRFMAST_RF_ENABLED=1

[env:nrfmast_fleet]
extends = env:nrfmast
build_flags =
  ${env:nrfmast.build_flags}
  -D NRFMAST_BOT_NAME='"Pine Bot"'
  -D NRFMAST_REQUIRE_IDENTITIES=1

[env:nrfmast_fleet_lua]
extends = env:nrfmast_fleet
build_unflags =
  ${env:nrfmast_fleet.build_unflags}
  -std=gnu++11
  -Ofast
  --specs=nano.specs
  -D USE_CC310_HW_CRYPTO=1
build_flags =
  ${env:nrfmast_fleet.build_flags}
  -std=gnu++17
  -Os
  -fno-fast-math
  -fstack-usage
  -D NRFMAST_PRODUCTION_LUA=1
  -D PINE_ROOM_CLIENTS=4
  -D PINE_REPEATER_PACKETS=28
  -D PINE_ROOM_POSTS=8
  -D PINE_ROOM_REGIONS=8
  -D PINE_ROOM_PACKETS=6
  -D MAX_GROUP_CHANNELS=4
  -D MESHCORE_NODE_BACKUP=1
  -D MESHCORE_ONCHIP_BOT=1
  -D MESHCORE_MAST_ADMIN=1
  -D ONCHIP_BOT_WASM=0
  -D ONCHIP_BOT_HTTPS=0
  -D ONCHIP_BOT_JOB_LIMIT=2
  -D ONCHIP_COMMAND_BOT_DEFAULT_ENABLED=1
  -D ONCHIP_COMMAND_BOT_NAME='"Pine Bot"'
  -I examples/nrfmast/platform
  -I examples/nrfmast
  -I examples/nrfmast/onchip
  -I examples/kiss_modem
  -Wl,-u,_printf_float
build_src_filter =
  ${env:nrfmast_fleet.build_src_filter}
  +<../examples/nrfmast/onchip/*.cpp>
  +<../examples/nrfmast/room/*.cpp>
lib_deps =
  ${env:nrfmast_fleet.lib_deps}
  densaugeo/base64 @ ~1.4.0

; Build-only resource probe. Do not deploy: no command/sandbox/scheduler API.
[env:nrfmast_lua_probe]
extends = env:nrfmast_fleet
build_flags =
  ${env:nrfmast_fleet.build_flags}
  -D NRFMAST_LUA_PROBE=1

; Pine on the GPS/battery-equipped SenseCAP Solar Node P1 / P1 Pro.
; Board wiring, GPS UART and QSPI pins come from the pinned upstream variant.
[env:nrfmast_solar_lua]
extends = SenseCap_Solar
platform = nordicnrf52@11.0.0
board_upload.maximum_size = 798720
board_upload.maximum_ram_size = 237568
build_unflags =
  -std=gnu++11
  -Ofast
  --specs=nano.specs
  -D USE_CC310_HW_CRYPTO=1
  -D ENABLE_ADVERT_ON_BOOT=1
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  -D LORA_TX_POWER=22
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
build_flags =
  ${SenseCap_Solar.build_flags}
  -std=gnu++17
  -Os
  -fno-fast-math
  -fstack-usage
  -D LORA_FREQ=912.525
  -D LORA_BW=250.0
  -D LORA_SF=7
  -D LORA_CR=5
  -D LORA_TX_POWER=2
  -D ENABLE_ADVERT_ON_BOOT=0
  -D ADMIN_PASSWORD='""'
  -D MAX_CONTACTS=8
  -D MAX_CONNECTIONS=1
  -D ENV_SKIP_GPS_DETECT=1
  -D NRFMAST_BLE_DFU=1
  -D NRFMAST_RF_ENABLED=1
  -D NRFMAST_BOT_NAME='"Pine Bot"'
  -D NRFMAST_REQUIRE_IDENTITIES=1
  -D NRFMAST_PRODUCTION_LUA=1
  -D PINE_ROOM_CLIENTS=4
  -D PINE_REPEATER_PACKETS=28
  -D PINE_ROOM_POSTS=8
  -D PINE_ROOM_REGIONS=8
  -D PINE_ROOM_PACKETS=6
  -D MAX_GROUP_CHANNELS=4
  -D MESHCORE_NODE_BACKUP=1
  -D MESHCORE_ONCHIP_BOT=1
  -D MESHCORE_MAST_ADMIN=1
  -D ONCHIP_BOT_WASM=0
  -D ONCHIP_BOT_HTTPS=0
  -D ONCHIP_BOT_JOB_LIMIT=2
  -D ONCHIP_COMMAND_BOT_DEFAULT_ENABLED=1
  -D ONCHIP_COMMAND_BOT_NAME='"Pine Bot"'
  -I examples/simple_repeater
  -I examples/nrfmast/platform
  -I examples/nrfmast
  -I examples/nrfmast/onchip
  -I examples/kiss_modem
  -Wl,-u,_printf_float
build_src_filter =
  ${SenseCap_Solar.build_src_filter}
  +<../examples/simple_repeater/MyMesh.cpp>
  +<../examples/simple_repeater/RateLimiter.cpp>
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/nrfmast/*.cpp>
  +<../examples/nrfmast/onchip/*.cpp>
  +<../examples/nrfmast/room/*.cpp>
lib_deps =
  ${SenseCap_Solar.lib_deps}
  densaugeo/base64 @ ~1.4.0

; RAK4630 on the RAK4631 WisBlock core; native notes use InternalFS.
[env:nrfmast_rak4631_rx]
extends = rak4631
platform = nordicnrf52@11.0.0
board_upload.maximum_size = 802816
board_upload.maximum_ram_size = 237568
build_unflags =
  -std=gnu++11
  ${sensor_base.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ENV_INCLUDE_RAK12035=1
  -D ENV_INCLUDE_BME680_BSEC=1
  -D ENABLE_ADVERT_ON_BOOT=1
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D LORA_TX_POWER=22
build_flags =
  ${rak4631.build_flags}
  -std=gnu++17
  -D LORA_FREQ=912.525
  -D LORA_BW=250.0
  -D LORA_SF=7
  -D LORA_CR=5
  -D LORA_TX_POWER=2
  -D ENABLE_ADVERT_ON_BOOT=0
  -D ADMIN_PASSWORD='""'
  -D MAX_CONTACTS=8
  -D MAX_CONNECTIONS=1
  -D NRFMAST_BLE_DFU=1
  -D NRFMAST_RF_ENABLED=0
  -D NRFMAST_QSPI_NOTES=0
  -D PINE_APPLICATION_START=0x26000
  -D NRFMAST_BOT_NAME='"RAK Bot"'
  -D NRFMAST_DEVICE_NAME='"RAK 4631"'
  -D NRFMAST_REQUIRE_IDENTITIES=1
  -I examples/simple_repeater
  -I examples/nrfmast
build_src_filter =
  ${rak4631.build_src_filter}
  -<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater/MyMesh.cpp>
  +<../examples/simple_repeater/RateLimiter.cpp>
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/nrfmast/*.cpp>
lib_deps = ${nrf52_base.lib_deps}

[env:nrfmast_rak4631]
extends = env:nrfmast_rak4631_rx
build_unflags =
  ${env:nrfmast_rak4631_rx.build_unflags}
  -D NRFMAST_RF_ENABLED=0
build_flags =
  ${env:nrfmast_rak4631_rx.build_flags}
  -D NRFMAST_RF_ENABLED=1

; RAK4631 + RAK13800 (W5100S), optionally powered by RAK19018 PoE.
; Framed companion TCP only; no Telnet administration listener.
[env:nrfmast_rak4631_rak13800]
extends = env:nrfmast_rak4631
build_flags =
  ${env:nrfmast_rak4631.build_flags}
  -D ETHERNET_ENABLED=1
  -D ETHERNET_USE_RAK13800=1
  -D ETHERNET_TCP_PORT=5000
  -D ETHERNET_DEBUG_LOGGING=1
  -D NRFMAST_ETHERNET_COMPANION=1
build_src_filter =
  ${env:nrfmast_rak4631.build_src_filter}
  +<helpers/ethernet/SerialEthernetInterface.cpp>
  +<helpers/ethernet/RAK13800/RAK13800EthernetInterface.cpp>
lib_deps =
  ${env:nrfmast_rak4631.lib_deps}
  https://github.com/RAKWireless/RAK13800-W5100S/archive/1.0.2.zip

; First installation only: create missing native identities and format erased
; InternalFS. Existing identities and non-erased unmountable volumes are retained.
[env:nrfmast_rak4631_init]
extends = env:nrfmast_rak4631
build_unflags =
  ${env:nrfmast_rak4631.build_unflags}
  -D NRFMAST_REQUIRE_IDENTITIES=1
build_flags =
  ${env:nrfmast_rak4631.build_flags}
  -D NRFMAST_REQUIRE_IDENTITIES=0
  -D PINE_FIRST_INSTALL=1

[env:nrfmast_rak4631_rak13800_init]
extends = env:nrfmast_rak4631_rak13800
build_unflags =
  ${env:nrfmast_rak4631_rak13800.build_unflags}
  -D NRFMAST_REQUIRE_IDENTITIES=1
build_flags =
  ${env:nrfmast_rak4631_rak13800.build_flags}
  -D NRFMAST_REQUIRE_IDENTITIES=0
  -D PINE_FIRST_INSTALL=1
