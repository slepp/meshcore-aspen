; Original LilyGO T-Beam v1.2 shared modem, 4 MB flash with PSRAM.
; Empty WiFi credentials: build check only. Copy privately before configuring.
[tbeam_modem]
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -D WIFI_SSID='""'
  -D WIFI_PWD='""'
  -D KISS_PSRAM_PAYLOADS=1
  -D KISS_HOSTNAME='"tbeam-modem"'
  -D KISS_TCP_PORT=8001
  -D KISS_MAX_TCP_CLIENTS=4
  -D KISS_REQUEST_QUEUE_DEPTH=12
  -D KISS_WIFI_TX_POWER=WIFI_POWER_8_5dBm

[env:TBeam_v12_SX1276_kiss_wifi_build]
extends = LilyGo_TBeam_SX1276, tbeam_modem
board_upload.flash_size = 4MB
board_upload.maximum_size = 1966080
board_build.partitions = min_spiffs.csv
build_src_filter = ${LilyGo_TBeam_SX1276.build_src_filter}
  +<../examples/kiss_modem/>
build_flags =
  ${LilyGo_TBeam_SX1276.build_flags}
  ${tbeam_modem.build_flags}

[env:TBeam_v12_SX1262_kiss_wifi_build]
extends = LilyGo_TBeam_SX1262, tbeam_modem
board_upload.flash_size = 4MB
board_upload.maximum_size = 1966080
board_build.partitions = min_spiffs.csv
build_src_filter = ${LilyGo_TBeam_SX1262.build_src_filter}
  +<../examples/kiss_modem/>
build_flags =
  ${LilyGo_TBeam_SX1262.build_flags}
  ${tbeam_modem.build_flags}

