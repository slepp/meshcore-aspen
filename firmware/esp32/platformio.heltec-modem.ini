; Build-only shared modem for regular Heltec WiFi LoRa 32 V3 (8 MiB flash, no PSRAM).
; Empty credentials do not provision a working WiFi connection. Do not flash this profile.
[env:Heltec_v3_kiss_wifi_build]
extends = Heltec_lora32_v3
board_upload.flash_size = 8MB
board_upload.maximum_size = 3342336
board_build.partitions = default_8MB.csv
build_unflags = -std=gnu++11
build_src_filter = ${Heltec_lora32_v3.build_src_filter}
  +<../examples/kiss_modem/>
build_flags =
  ${Heltec_lora32_v3.build_flags}
  -std=gnu++17
  -D WIFI_SSID='""'
  -D WIFI_PWD='""'
  -D KISS_HOSTNAME='"heltec-modem"'
  -D KISS_TCP_PORT=8001
  -D KISS_MAX_TCP_CLIENTS=4
  -D KISS_REQUEST_QUEUE_DEPTH=12
  -D KISS_WIFI_TX_POWER=WIFI_POWER_8_5dBm
